<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aigrafka Preview</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;800&display=swap');
      :root {
        background: #181818;
        color: #f5f5f5;
      }
      body {
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        min-height: 100vh;
        padding: 0;
        overflow-y: auto;
        background: #181818;
      }
      * {
        box-sizing: border-box;
        font-family: 'Space Grotesk', 'DM Sans', 'Segoe UI', sans-serif;
      }
      #root {
        width: 430px;
        height: fit-content;
        min-height: 0;
        max-height: calc(100vh - 24px);
        border-radius: 18px;
        overflow-x: hidden;
        overflow-y: auto;
        border: 1px solid #2a2a2a;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
        background: #181818;
        display: flex;
        flex-direction: column;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/panel/preview.tsx"></script>
  </body>
</html>

<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AIgrafka – strona w budowie</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0f1115;
        --card: #181b22;
        --text: #f4f5f7;
        --muted: #c9cdd6;
        --accent: #00b0ff;
        --border: #252a33;
      }
      body {
        margin: 0;
        font-family:
          'Inter',
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        background:
          radial-gradient(
            circle at 20% 20%,
            rgba(0, 176, 255, 0.07),
            transparent 25%
          ),
          radial-gradient(
            circle at 80% 0%,
            rgba(0, 255, 170, 0.05),
            transparent 22%
          ),
          var(--bg);
        color: var(--text);
        display: grid;
        place-items: center;
        min-height: 100vh;
        padding: 24px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.45);
        padding: 32px;
        max-width: 540px;
        width: 100%;
        text-align: center;
      }
      h1 {
        margin: 0 0 12px;
        letter-spacing: 0.2px;
      }
      p {
        margin: 0 0 18px;
        color: var(--muted);
      }
      .pill {
        display: inline-block;
        padding: 8px 12px;
        border-radius: 999px;
        background: rgba(0, 176, 255, 0.12);
        color: var(--text);
        font-weight: 600;
        margin-bottom: 14px;
      }
      a {
        color: var(--accent);
        text-decoration: none;
        font-weight: 600;
      }
      a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="pill">AIgrafka</div>
      <h1>Witam na AIgrafka</h1>
      <p>Strona w budowie. Wróć wkrótce.</p>
      <p>
        Polityka prywatności: <a href="/privacy-policy/">/privacy-policy/</a>
      </p>
    </div>
  </body>
</html>
